<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="400" viewBox="0 0 1320 400" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect width="1320" height="400" fill="#ffffff"/>

  <text x="40" y="48" font-size="17" font-weight="600" fill="#171717">The probability shelf: softmax over all ten logits</text>
  <text x="40" y="74" font-size="14" fill="#737373">&#8220;the modem needs a ___&#8221;: top five of ten words shown; the full distribution sums to 100%</text>

  <!-- rows: label right-aligned at x=150, bars from x=170, 20px per 1% -->
  <!-- reboot 45% -->
  <text x="150" y="127" font-size="15" font-weight="600" fill="#171717" text-anchor="end">reboot</text>
  <rect x="170" y="112" width="900" height="22" rx="4" fill="#171717"/>
  <text x="1082" y="128" font-size="14" font-weight="600" fill="#171717">45%</text>

  <!-- needs 15% -->
  <text x="150" y="177" font-size="15" fill="#525252" text-anchor="end">needs</text>
  <rect x="170" y="162" width="300" height="22" rx="4" fill="#a3a3a3"/>
  <text x="482" y="178" font-size="14" font-weight="600" fill="#525252">15%</text>

  <!-- tech 12% -->
  <text x="150" y="227" font-size="15" fill="#525252" text-anchor="end">tech</text>
  <rect x="170" y="212" width="240" height="22" rx="4" fill="#a3a3a3"/>
  <text x="422" y="228" font-size="14" font-weight="600" fill="#525252">12%</text>

  <!-- modem 9% -->
  <text x="150" y="277" font-size="15" fill="#525252" text-anchor="end">modem</text>
  <rect x="170" y="262" width="180" height="22" rx="4" fill="#a3a3a3"/>
  <text x="362" y="278" font-size="14" font-weight="600" fill="#525252">9%</text>

  <!-- signal 7% -->
  <text x="150" y="327" font-size="15" fill="#525252" text-anchor="end">signal</text>
  <rect x="170" y="312" width="140" height="22" rx="4" fill="#a3a3a3"/>
  <text x="322" y="328" font-size="14" font-weight="600" fill="#525252">7%</text>

  <!-- all others -->
  <text x="150" y="372" font-size="15" fill="#737373" text-anchor="end">all others</text>
  <text x="170" y="372" font-size="14" fill="#737373">&#60; 12% combined</text>

  <!-- baseline -->
  <line x1="170" y1="98" x2="170" y2="346" stroke="#d4d4d4" stroke-width="1"/>
</svg>
